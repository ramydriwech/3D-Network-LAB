<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, sans-serif" font-size="14">
  <title>Maquette de l'interface — 3D Network Topology</title>
  <rect width="960" height="600" fill="#0b1220"/>
  <!-- Barre du haut -->
  <rect x="0" y="0" width="960" height="52" fill="#111a2e" stroke="#26344f"/>
  <text x="18" y="32" fill="#e6edf7" font-weight="600">3D Network Topology</text>
  <rect x="200" y="12" width="280" height="28" rx="6" fill="#18233b" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="212" y="31" fill="#93a3bd">#scenario-slot — choix du scénario</text>
  <rect x="610" y="12" width="110" height="28" rx="6" fill="#18233b" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="620" y="31" fill="#93a3bd">#install-slot</text>
  <rect x="730" y="12" width="110" height="28" rx="6" fill="#2e1f57" stroke="#8b5cf6" stroke-dasharray="4 3"/>
  <text x="748" y="31" fill="#c4b5fd">#xr-slot</text>
  <rect x="850" y="12" width="96" height="28" rx="6" fill="#18233b" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="862" y="31" fill="#93a3bd">#lang-slot</text>
  <!-- Scène -->
  <rect x="0" y="52" width="640" height="492" fill="#0b1220" stroke="#26344f"/>
  <text x="18" y="80" fill="#93a3bd" font-size="12">Glisser : tourner · Molette : zoomer · Clic droit : déplacer</text>
  <text x="250" y="110" fill="#38bdf8" font-weight="600">#scene — canevas 3D</text>
  <g stroke="#64748b" stroke-width="3">
    <line x1="110" y1="230" x2="230" y2="300"/><line x1="110" y1="380" x2="230" y2="300"/>
    <line x1="230" y1="300" x2="330" y2="300"/><line x1="330" y1="300" x2="430" y2="300"/>
    <line x1="430" y1="300" x2="540" y2="230"/><line x1="430" y1="300" x2="540" y2="380"/>
  </g>
  <rect x="85" y="210" width="50" height="40" rx="4" fill="#3b82f6"/><text x="92" y="200" fill="#e6edf7">PC1</text>
  <rect x="85" y="360" width="50" height="40" rx="4" fill="#3b82f6"/><text x="92" y="420" fill="#e6edf7">PC2</text>
  <rect x="195" y="288" width="70" height="24" rx="4" fill="#10b981"/><text x="212" y="280" fill="#e6edf7">SW1</text>
  <circle cx="330" cy="300" r="24" fill="#f97316"/><text x="320" y="266" fill="#e6edf7">R1</text>
  <rect x="395" y="288" width="70" height="24" rx="4" fill="#10b981"/><text x="412" y="280" fill="#e6edf7">SW2</text>
  <rect x="515" y="210" width="50" height="40" rx="4" fill="#3b82f6"/><text x="522" y="200" fill="#e6edf7">PC3</text>
  <rect x="515" y="360" width="50" height="40" rx="4" fill="#3b82f6"/><text x="522" y="420" fill="#e6edf7">PC4</text>
  <circle cx="170" cy="265" r="9" fill="#f59e0b"/><text x="184" y="258" fill="#fbbf24" font-size="12">ARP Request</text>
  <!-- Commandes -->
  <rect x="0" y="544" width="640" height="56" fill="#111a2e" stroke="#26344f"/>
  <text x="16" y="578" fill="#38bdf8" font-weight="600">#controls</text>
  <g font-size="13">
    <rect x="110" y="556" width="86" height="32" rx="6" fill="#0ea5e9"/><text x="126" y="577" fill="#04121f">▶ Lecture</text>
    <rect x="204" y="556" width="78" height="32" rx="6" fill="#18233b" stroke="#26344f"/><text x="218" y="577" fill="#e6edf7">⏸ Pause</text>
    <rect x="290" y="556" width="96" height="32" rx="6" fill="#18233b" stroke="#26344f"/><text x="302" y="577" fill="#e6edf7">⏭ Pas à pas</text>
    <rect x="394" y="556" width="88" height="32" rx="6" fill="#18233b" stroke="#26344f"/><text x="404" y="577" fill="#e6edf7">Vitesse ×1</text>
    <rect x="490" y="556" width="104" height="32" rx="6" fill="#18233b" stroke="#26344f"/><text x="500" y="577" fill="#e6edf7">↺ Réinitialiser</text>
  </g>
  <!-- Panneaux -->
  <rect x="640" y="52" width="320" height="548" fill="#0b1220" stroke="#26344f"/>
  <g fill="#111a2e" stroke="#26344f">
    <rect x="652" y="64" width="296" height="150" rx="8"/><rect x="652" y="224" width="296" height="100" rx="8"/>
    <rect x="652" y="334" width="296" height="130" rx="8"/><rect x="652" y="474" width="296" height="114" rx="8"/>
  </g>
  <g fill="#38bdf8" font-weight="600">
    <text x="664" y="88">#explanations</text><text x="664" y="248">#info</text>
    <text x="664" y="358">#inspector</text><text x="664" y="498">#journal</text>
  </g>
  <g fill="#93a3bd" font-size="12">
    <text x="664" y="110">Titre et résumé du scénario</text><text x="664" y="130">Étape en cours</text>
    <text x="664" y="150">« Ce qui se passe » : l'explication de</text><text x="664" y="166">chaque message, au fil de la lecture</text>
    <text x="664" y="270">Équipement sélectionné : nom, IP, MAC,</text><text x="664" y="286">tables (ARP, MAC, routage), bouton ping</text>
    <text x="664" y="380">Champs du paquet cliqué, par couche :</text><text x="664" y="396">Ethernet · IP · transport · application</text>
    <text x="664" y="520">Une ligne par message échangé</text><text x="664" y="536">(heure, trajet, nom) — clic = inspecter</text>
  </g>
</svg>
