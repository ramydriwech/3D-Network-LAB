# Publication d'une version : pousser une étiquette « v… » crée la release GitHub avec
# une archive du site prête à être servie (plan B de la soutenance : copie locale).
#
#   git tag -a v1.0 -m "Version 1.0" && git push origin v1.0

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/generate-precache.mjs
      - name: Archive du site
        run: |
          mkdir _site
          cp -r index.html styles.css main.js simulation.js manifest.json sw.js precache-manifest.js src scenarios assets vendor _site/
          cd _site && zip -r ../3d-network-topology-${{ github.ref_name }}.zip .
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "3d-network-topology-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
